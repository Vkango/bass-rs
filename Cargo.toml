[package]
name = "bass-library"
version = "0.1.0"
edition = "2024"
description = "Rust bindings and runtime loader for the BASS 2.4 audio library and BASS_FX"
license = "MIT"
repository = "https://github.com/Vkango/bass-rs"
homepage = "https://github.com/Vkango/bass-rs"
readme = "README.md"
keywords = ["audio", "bass", "bindings", "wasapi", "directsound"]
categories = ["external-ffi-bindings", "multimedia::audio"]
exclude = ["bass-cli/", "bass24/", "bass_fx24/", "target/", "Cargo.lock"]

[workspace]
members = ["bass-cli"]
resolver = "3"

[dependencies]
libloading = "0.8"
thiserror = "2"
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }

[lib]
name = "bass_library"
path = "src/lib.rs"
